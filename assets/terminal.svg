<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-label="whoami: product-minded developer. Status: building and shipping."><title>whoami: product-minded developer. Status: building and shipping.</title><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="168" fill="#101114"/><path d="M48 31V133" stroke="#8bf4ed" stroke-width="3"/><text x="76" y="54" font-size="18" fill="#9a9ca5" font-family="Consolas, monospace" letter-spacing="1">$ whoami</text><text x="76" y="92" font-size="25" fill="#eeeee8" >product-minded dev</text><text x="683" y="54" font-size="18" fill="#9a9ca5" font-family="Consolas, monospace" letter-spacing="1">$ status</text><text x="683" y="92" font-size="25" fill="#8bf4ed" >building → shipping</text><text x="76" y="138" font-size="18" fill="#9a9ca5" font-family="Consolas, monospace" letter-spacing="1">IDEA → UX → FRONTEND → API → DATA → DEPLOY → ITERATE</text></g></svg>
