  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#panel)" stroke="#2c4557"/>
  <path d="M0 51H1200" stroke="#375266" stroke-opacity=".7"/>
  <circle cx="31" cy="26" r="6" fill="#6e8193"/><circle cx="53" cy="26" r="6" fill="#4ca4bc"/><circle cx="75" cy="26" r="6" fill="#8c79d5"/>
