  <text x="245" y="264" fill="#48bdc9" font-family="Consolas, Menlo, monospace" font-size="24">→</text>
  <text x="293" y="264" fill="#dce9f0" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700">FRONTEND</text>
