<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Engineering manifesto</title>
  <desc id="desc">whoami: product-minded developer. status: building and shipping. Product loop from idea through iteration.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0e1520"/><stop offset="1" stop-color="#11172a"/></linearGradient>
