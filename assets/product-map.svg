<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-label="CV Creator Pro architecture from editor through API, data, AI and exports"><title>CV Creator Pro architecture from editor through API, data, AI and exports</title><g font-family="Arial,Helvetica,sans-serif"><rect width="1200" height="332" fill="#f0f0e9"/><text x="42" y="42" fill="#414eff" font-size="17" font-family="Consolas,Menlo,monospace" letter-spacing="1" >SYSTEM MAP / CV CREATOR PRO</text><path d="M42 60L1158 60" stroke="#adb0af" stroke-width="1"/><text x="42" y="113" fill="#101217" font-size="34" font-weight="700">A product is a chain of decisions.</text><g fill="none" stroke="#9097a2" stroke-width="2"><path d="M235 190H263M456 190H532M456 190H498V136H898V151"/><path d="M256 184L263 190L256 196M525 184L532 190L525 196M892 144L898 151L904 144"/></g><g font-family="Arial,Helvetica,sans-serif"><rect x="42" y="151" width="193" height="79" fill="#101217"/><text x="55" y="180" fill="#f0f0e9" font-size="22" font-weight="700">REACT</text><text x="55" y="209" fill="#75e3df" font-size="15" >Editor / templates</text><rect x="263" y="151" width="193" height="79" fill="#101217"/><text x="276" y="180" fill="#f0f0e9" font-size="22" font-weight="700">EXPRESS</text><text x="276" y="209" fill="#75e3df" font-size="15" >API / ownership</text><rect x="532" y="151" width="193" height="79" fill="#101217"/><text x="545" y="180" fill="#f0f0e9" font-size="22" font-weight="700">PRISMA</text><text x="545" y="209" fill="#75e3df" font-size="15" >Resumes / sessions</text><rect x="801" y="151" width="193" height="79" fill="#101217"/><text x="814" y="180" fill="#f0f0e9" font-size="22" font-weight="700">AI</text><text x="814" y="209" fill="#75e3df" font-size="15" >Writing assistant</text></g><text x="42" y="284" fill="#414eff" font-size="18" font-family="Consolas,Menlo,monospace" letter-spacing="1" >CLIENT EXPORTS  →  PDF / DOCX / TXT / JSON</text><text x="1158" y="284" fill="#10121