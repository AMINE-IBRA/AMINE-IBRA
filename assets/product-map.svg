<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" role="img" aria-labelledby="title desc">
<title id="title">How the pieces connect</title><desc id="desc">A product system map showing experience, application, intelligence, and release layers.</desc>
<rect width="1200" height="338" rx="14" fill="#10171e" stroke="#40515d"/>
<text x="34" y="40" fill="#98aeb9" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="2">A PRODUCT IS A CONNECTED SYSTEM</text>
<path d="M34 58H1166" stroke="#3f515d"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="34" y="84" width="253" height="142" rx="8" fill="#192832" stroke="#567980"/>
<text x="54" y="119" fill="#85ded5" font-size="16" font-weight="700">01 / EXPERIENCE</text>
<text x="54" y="161" fill="#edf2f0" font-size="30" font-weight="700">UX + interface</text>
<text x="54" y="193" fill="#a7bac2" font-size="18">What people touch</text>
<rect x="327" y="84" width="253" height="142" rx="8" fill="#192732" stroke="#58758d"/>
<text x="347" y="119" fill="#89bbdc" font-size="16" font-weight="700">02 / APPLICATION</text>
<text x="347" y="161" fill="#edf2f0" font-size="30" font-weight="700">Logic + API</text>
<text x="347" y="193" fill="#a7bac2" font-size="18">What makes it work</text>
<rect x="620" y="84" width="253" height="142" rx="8" fill="#1b2532" stroke="#68738d"/>
<text x="640" y="119" fill="#a5b7e3" font-size="16" font-weight="700">03 / FOUNDATION</text>
<text x="640" y="161" fill="#edf2f0" font-size="30" font-weight="700">Auth + data</text>
<text x="640" y="193" fill="#a7bac2" font-size="18">What holds it together</text>
<rect x="913" y="84" width="253" height="142" rx="8" fill="#202332" stroke="#796b8b"/>
<text x="933" y="119" fill="#b7a3d2" font-size="16" font-weight="700">04 / DELIVERY</text>
<text x="933" y="161" fill="#edf2f0" font-size="30" font-weight="700">Build + deploy</text>
<text x="933" y="193" fill="#a7bac2" font-size="18">What reaches the user</text>
</g>
